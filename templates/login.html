
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso - Sistema de Gastos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .contenedor {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 6px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Control de Gastos</h2>
        <p>Inicia sesión para continuar</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="usuario"
                   placeholder="Usuario" required>

            <input type="password" name="clave"
                   placeholder="Contraseña" required>

            <button type="submit">
                Iniciar sesión
            </button>
        </form>
    </div>
</body>
</html>
